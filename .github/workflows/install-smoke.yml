name: install-smoke

# Runs the curl installers for real on GitHub's Linux and Windows runners,
# against the checkout, not stubs.
#
# The server image is built from the checkout once (the `image` job), saved as
# an artifact, and each Linux job pushes it to a throwaway `registry:2` on the
# runner: the installer then pulls `localhost:5000/diazo:smoke` (DOOP_IMAGE)
# exactly like it would pull ghcr.io/bryann2k/diazo:main. The scripts and the
# `diazo` command come from the checkout through DIAZO_LIB, so a run tests the
# code in the PR, not what raw.githubusercontent.com serves on main. Both
# overrides are plain environment variables; the defaults users get are
# unchanged.
#
# A local registry rather than a pre-tagged image: install-local.sh always
# pulls, so the pull path is exercised too.
#
# Not covered: Fedora with SELinux enforcing. GitHub has no Fedora runner, a
# fedora container inherits the Ubuntu host kernel where SELinux is disabled,
# so install-local.sh's `:Z` relabel branch and the rpm install path stay
# covered by the unit tests only.
#
# Not a required check: it proves the installers end to end on demand and on
# installer-touching changes; CI (ci.yml) stays the merge gate.

on:
  workflow_dispatch:
  push:
    branches: [dev, staging, main]
    paths:
      - 'scripts/install*.sh'
      - 'scripts/install-desktop.ps1'
      - '.github/workflows/install-smoke.yml'
  pull_request:
    branches: [dev, staging, main]
    paths:
      - 'scripts/install*.sh'
      - 'scripts/install-desktop.ps1'
      - '.github/workflows/install-smoke.yml'

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The image the two Linux jobs install: built from the checkout, so a change
  # that pairs an installer flag with a server route is tested whole. The
  # `:staging` image would be faster to pull but tests last week's code.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # bash (not the unspecified default) so -o pipefail reaches the tee pipelines
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: localhost:5000/diazo:smoke
          load: true
          build-args: |
            DOOP_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=install-smoke
          cache-to: type=gha,mode=max,scope=install-smoke
      - name: Export the image
        run: docker save localhost:5000/diazo:smoke | gzip > "$RUNNER_TEMP/diazo-image.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: diazo-image
          path: ${{ runner.temp }}/diazo-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  linux-docker:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # bash (not the unspecified default) so -o pipefail reaches the tee pipelines
    defaults:
      run:
        shell: bash
    env:
      DOOP_IMAGE: localhost:5000/diazo:smoke
      DIAZO_LIB: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: diazo-image
          path: ${{ runner.temp }}

      - name: Load the image and serve it from a local registry
        run: |
          gunzip -c "$RUNNER_TEMP/diazo-image.tar.gz" | docker load
          docker run -d --name registry -p 5000:5000 registry:2
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:5000/v2/ && break
            [ "$i" = 30 ] && exit 1
            sleep 1
          done
          docker push localhost:5000/diazo:smoke

      - name: Run install-local.sh
        run: sh scripts/install-local.sh 2>&1 | tee "$RUNNER_TEMP/install-local.log"

      - name: Assert the server answers
        run: |
          curl -fsS http://127.0.0.1:4400/healthz
          test -d "$HOME/.diazo/data"
          test -n "$(ls -A "$HOME/.diazo/data")"
          test "$(stat -c %a "$HOME/.diazo/diazo.env")" = 600

      - name: Run install.sh --server-only
        run: sh scripts/install.sh --server-only 2>&1 | tee "$RUNNER_TEMP/install.log"

      - name: Exercise the diazo command
        run: |
          # the link lands in the first writable dir of DIAZO_LINK_DIRS
          test -L "$HOME/.local/bin/diazo" || test -L /usr/local/bin/diazo
          diazo status | tee "$RUNNER_TEMP/diazo-status.log"
          grep -qi answering "$RUNNER_TEMP/diazo-status.log"
          diazo stop
          ! curl -fsS --max-time 5 http://127.0.0.1:4400/healthz
          diazo start
          diazo status | grep -qi answering
          diazo update 2>&1 | tee "$RUNNER_TEMP/diazo-update.log"
          diazo status | grep -qi answering
          curl -fsS http://127.0.0.1:4400/healthz

      - name: Uninstall and assert nothing is left
        run: |
          diazo uninstall --purge 2>&1 | tee "$RUNNER_TEMP/uninstall.log"
          test ! -d "$HOME/.diazo"
          test ! -L "$HOME/.local/bin/diazo"
          test ! -L /usr/local/bin/diazo
          test ! -e /usr/local/bin/diazo
          test ! -d "$HOME/.local/share/dev.bryann2k.diazo"
          ! docker inspect diazo >/dev/null 2>&1
          ! docker image inspect "$DOOP_IMAGE" >/dev/null 2>&1

      - name: Collect logs on failure
        if: failure()
        run: |
          docker logs diazo > "$RUNNER_TEMP/container.log" 2>&1 || true
          # allowlisted fields only: a full inspect also dumps Config.Env,
          # which holds the install's generated secrets
          docker inspect diazo \
            --format 'state={{json .State}} image={{.Config.Image}} restart={{.HostConfig.RestartPolicy.Name}} userns={{.HostConfig.UsernsMode}}' \
            > "$RUNNER_TEMP/container-state.log" 2>&1 || true
          docker ps -a > "$RUNNER_TEMP/docker-ps.log" 2>&1 || true
          journalctl --user -u diazo.service --no-pager > "$RUNNER_TEMP/unit.log" 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-logs-linux-docker
          # named files only: a *.log glob would upload anything a step left behind
          path: |
            ${{ runner.temp }}/install-local.log
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/diazo-status.log
            ${{ runner.temp }}/diazo-update.log
            ${{ runner.temp }}/uninstall.log
            ${{ runner.temp }}/container.log
            ${{ runner.temp }}/container-state.log
            ${{ runner.temp }}/docker-ps.log
            ${{ runner.temp }}/unit.log
          if-no-files-found: ignore
          retention-days: 7

  linux-podman:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # bash (not the unspecified default) so -o pipefail reaches the tee pipelines
    defaults:
      run:
        shell: bash
    env:
      DOOP_IMAGE: localhost:5000/diazo:smoke
      DIAZO_LIB: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: diazo-image
          path: ${{ runner.temp }}

      - name: Prepare Podman and hide Docker
        run: |
          # podman ships on the ubuntu image; install it only if it is missing
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y podman
          fi
          # rootless podman needs subuid/subgid ranges for the runner user
          if ! grep -q "^$USER:" /etc/subuid; then
            echo "$USER:200000:65536" | sudo tee -a /etc/subuid
            echo "$USER:200000:65536" | sudo tee -a /etc/subgid
          fi
          podman system migrate >/dev/null 2>&1 || true
          # podman talks https to registries unless told otherwise; the
          # throwaway registry is plain http (the installer's own `podman pull`
          # reads the same config — a flag would not reach it)
          mkdir -p "$HOME/.config/containers/registries.conf.d"
          printf '[[registry]]\nlocation = "localhost:5000"\ninsecure = true\n' \
            > "$HOME/.config/containers/registries.conf.d/localhost-5000.conf"
          # the installer must find no docker in PATH so it picks podman
          sudo mv "$(command -v docker)" /usr/local/share/docker.hidden-by-install-smoke

      - name: Load the image and serve it from a local registry
        run: |
          gunzip -c "$RUNNER_TEMP/diazo-image.tar.gz" | podman load
          podman run -d --name registry -p 5000:5000 docker.io/library/registry:2
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:5000/v2/ && break
            [ "$i" = 30 ] && exit 1
            sleep 1
          done
          podman push localhost:5000/diazo:smoke

      - name: Run install-local.sh
        run: sh scripts/install-local.sh 2>&1 | tee "$RUNNER_TEMP/install-local.log"

      - name: Assert the server answers under keep-id
        run: |
          curl -fsS http://127.0.0.1:4400/healthz
          test -d "$HOME/.diazo/data"
          test -n "$(ls -A "$HOME/.diazo/data")"
          test "$(stat -c %a "$HOME/.diazo/diazo.env")" = 600
          # keep-id pins the caller into the container at the image's own uid
          # (10001): the proof is that files the server writes inside the
          # mount land owned by the caller on the host, not a subuid.
          # podman 4.x reports the mode in an annotation (UsernsMode stays
          # "private"), newer podman fills UsernsMode — check both.
          podman inspect diazo --format '{{.HostConfig.UsernsMode}} {{index .Config.Annotations "io.podman.annotations.userns"}}' | grep -q keep-id
          test "$(podman exec diazo id -u)" = "10001"
          test "$(stat -c %u "$HOME/.diazo/data")" = "$(id -u)"
          test "$(stat -c %u "$HOME/.diazo/data/pg")" = "$(id -u)"

      - name: Run install.sh --server-only
        run: sh scripts/install.sh --server-only 2>&1 | tee "$RUNNER_TEMP/install.log"

      - name: Exercise the diazo command
        run: |
          test -L "$HOME/.local/bin/diazo" || test -L /usr/local/bin/diazo
          diazo status | tee "$RUNNER_TEMP/diazo-status.log"
          grep -qi answering "$RUNNER_TEMP/diazo-status.log"
          diazo stop
          ! curl -fsS --max-time 5 http://127.0.0.1:4400/healthz
          diazo start
          diazo status | grep -qi answering
          diazo update 2>&1 | tee "$RUNNER_TEMP/diazo-update.log"
          diazo status | grep -qi answering
          curl -fsS http://127.0.0.1:4400/healthz

      - name: Uninstall and assert nothing is left
        run: |
          diazo uninstall --purge 2>&1 | tee "$RUNNER_TEMP/uninstall.log"
          test ! -d "$HOME/.diazo"
          test ! -L "$HOME/.local/bin/diazo"
          test ! -L /usr/local/bin/diazo
          test ! -e /usr/local/bin/diazo
          test ! -d "$HOME/.local/share/dev.bryann2k.diazo"
          ! podman inspect diazo >/dev/null 2>&1
          ! podman image inspect "$DOOP_IMAGE" >/dev/null 2>&1

      - name: Collect logs on failure
        if: failure()
        run: |
          podman logs diazo > "$RUNNER_TEMP/container.log" 2>&1 || true
          # allowlisted fields only: a full inspect also dumps Config.Env,
          # which holds the install's generated secrets
          podman inspect diazo \
            --format 'state={{json .State}} image={{.Config.Image}} restart={{.HostConfig.RestartPolicy.Name}} userns={{.HostConfig.UsernsMode}} annotation-userns={{index .Config.Annotations "io.podman.annotations.userns"}}' \
            > "$RUNNER_TEMP/container-state.log" 2>&1 || true
          podman ps -a > "$RUNNER_TEMP/podman-ps.log" 2>&1 || true
          journalctl --user -u diazo.service --no-pager > "$RUNNER_TEMP/unit.log" 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-logs-linux-podman
          # named files only: a *.log glob would upload anything a step left behind
          path: |
            ${{ runner.temp }}/install-local.log
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/diazo-status.log
            ${{ runner.temp }}/diazo-update.log
            ${{ runner.temp }}/uninstall.log
            ${{ runner.temp }}/container.log
            ${{ runner.temp }}/container-state.log
            ${{ runner.temp }}/podman-ps.log
            ${{ runner.temp }}/unit.log
          if-no-files-found: ignore
          retention-days: 7

  # The .deb path needs no image: it downloads the latest desktop-v* release
  # assets from GitHub, like a user's machine does.
  linux-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # bash (not the unspecified default) so -o pipefail reaches the tee pipelines
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # the runner's apt index can be minutes-old and already point at
      # superseded package versions (404 on fetch); refresh it like any user
      # would before installing a package
      - name: Refresh the apt index
        run: sudo apt-get update

      - name: Install the .deb package
        run: sh scripts/install-desktop.sh 2>&1 | tee "$RUNNER_TEMP/desktop-deb.log"

      - name: Assert the package is installed
        run: |
          dpkg -s diazo | grep -E '^(Package|Version|Status):'
          command -v doop-desktop
          dpkg -L diazo | tee "$RUNNER_TEMP/dpkg-files.log"
          grep -q 'share/applications/.*\.desktop$' "$RUNNER_TEMP/dpkg-files.log"

      - name: Install the AppImage
        run: sh scripts/install-desktop.sh --appimage 2>&1 | tee "$RUNNER_TEMP/desktop-appimage.log"

      - name: Assert the AppImage is in place
        run: |
          appimage=$(find "$HOME" -name 'Diazo_*_amd64.AppImage' -print -quit)
          test -n "$appimage"
          test -x "$appimage"
          test -f "$HOME/.local/share/applications/doop-desktop-appimage.desktop"
          grep -q "Name=Diazo" "$HOME/.local/share/applications/doop-desktop-appimage.desktop"

      - name: Uninstall and assert the app is gone
        run: |
          sh scripts/install-desktop.sh --uninstall 2>&1 | tee "$RUNNER_TEMP/desktop-uninstall.log"
          test -z "$(find "$HOME" -name 'Diazo_*_amd64.AppImage' -print -quit)"
          test ! -f "$HOME/.local/share/applications/doop-desktop-appimage.desktop"
          ! dpkg -s diazo >/dev/null 2>&1

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-logs-linux-desktop
          # named files only: a *.log glob would upload anything a step left behind
          path: |
            ${{ runner.temp }}/desktop-deb.log
            ${{ runner.temp }}/dpkg-files.log
            ${{ runner.temp }}/desktop-appimage.log
            ${{ runner.temp }}/desktop-uninstall.log
          if-no-files-found: ignore
          retention-days: 7

  # -Server is probed before anything installs, so https://example.invalid can
  # only exercise the refusal path; the write path needs a server that answers
  # /api/locale-config. The checkout's own server (node + tsx, embedded PGlite)
  # runs on the runner for that — a real Diazo server, not a stub.
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: A dead -Server address is refused and installs nothing
        run: |
          $env:DOOP_DESKTOP_SERVER = 'https://example.invalid'
          $out = Get-Content -Raw scripts/install-desktop.ps1 | iex 6>&1 | Out-String
          $out | Tee-Object "$env:RUNNER_TEMP/desktop-refused.log"
          if ($out -notmatch 'No Diazo server answered') {
            throw 'expected the -Server probe to refuse https://example.invalid'
          }
          if (Test-Path "$env:LOCALAPPDATA\Diazo\doop-desktop.exe") {
            throw 'the app was installed even though the probe failed'
          }

      # A process spawned by an earlier step does not outlive it on the
      # windows runner, so the server from the checkout starts in the same
      # step that probes it.
      - name: Install the app pointed at a local server
        env:
          PORT: '4400'
          BETTER_AUTH_URL: http://127.0.0.1:4400
          TRUSTED_ORIGINS: http://127.0.0.1:4400
          BETTER_AUTH_SECRET: install-smoke-ci-secret-0123456789abcdef
        run: |
          Start-Process -FilePath 'node' `
            -ArgumentList 'node_modules/tsx/dist/cli.mjs', 'server/index.ts' `
            -WorkingDirectory $PWD `
            -RedirectStandardOutput "$env:RUNNER_TEMP/server.out.log" `
            -RedirectStandardError "$env:RUNNER_TEMP/server.err.log" `
            -WindowStyle Hidden
          $ready = $false
          $deadline = (Get-Date).AddSeconds(240)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            try {
              $ok = (Invoke-RestMethod 'http://127.0.0.1:4400/healthz' -TimeoutSec 5).ok
            } catch { $ok = $false }
            if ($ok) { $ready = $true; break }
          }
          if (-not $ready) {
            Get-Content "$env:RUNNER_TEMP/server.err.log" -ErrorAction SilentlyContinue
            throw 'the server did not answer /healthz'
          }
          $env:DOOP_DESKTOP_SERVER = 'http://127.0.0.1:4400'
          $out = Get-Content -Raw scripts/install-desktop.ps1 | iex 6>&1 | Out-String
          $out | Tee-Object "$env:RUNNER_TEMP/desktop-install.log"
          if ($out -match 'diazo: error:') { throw "the installer reported an error`n$out" }
          $exe = "$env:LOCALAPPDATA\Diazo\doop-desktop.exe"
          if (-not (Test-Path $exe)) { throw "the app is not at $exe" }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Diazo'
          if (-not (Test-Path $key)) { throw 'the uninstall registry key is missing' }
          $json = Get-Content -Raw "$env:APPDATA\dev.bryann2k.diazo\server.json" | ConvertFrom-Json
          if ($json.url -ne 'http://127.0.0.1:4400') {
            throw "server.json names $($json.url), not http://127.0.0.1:4400"
          }

      - name: Uninstall and assert the app is gone
        run: |
          $env:DOOP_DESKTOP_UNINSTALL = '1'
          $out = Get-Content -Raw scripts/install-desktop.ps1 | iex 6>&1 | Out-String
          $out | Tee-Object "$env:RUNNER_TEMP/desktop-uninstall.log"
          Start-Sleep -Seconds 3
          if ($out -match 'diazo: error:') { throw "the uninstaller reported an error`n$out" }
          if (Test-Path "$env:LOCALAPPDATA\Diazo\doop-desktop.exe") { throw 'the app is still installed' }
          if (-not (Test-Path "$env:APPDATA\dev.bryann2k.diazo\server.json")) { throw 'server.json was removed: the sign-in data must be kept' }

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-logs-windows-desktop
          # named files only: a *.log glob would upload anything a step left behind
          path: |
            ${{ runner.temp }}/desktop-refused.log
            ${{ runner.temp }}/desktop-install.log
            ${{ runner.temp }}/desktop-uninstall.log
            ${{ runner.temp }}/server.out.log
            ${{ runner.temp }}/server.err.log
          if-no-files-found: ignore
          retention-days: 7
